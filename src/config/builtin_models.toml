# Alibaba Qwen (Bailian, Beijing region):
#   https://help.aliyun.com/zh/model-studio/model-pricing
#   https://help.aliyun.com/zh/model-studio/context-cache
# Claude Code sends cache_control, which Bailian bills as explicit caching:
# cache hits at 10% and cache writes at 125% of the tier's input price.
# qwen3.8-max / qwen3.8-flash are not listed: their cache-hit price is only
# published in the Bailian console.

[[models]]
pattern = "qwen3-coder-plus"
match = "exact"
context_limit = 1000000

[models.pricing]
currency = "¥"
input = 4.0
output = 16.0
cache_read = 0.4
cache_write = 5.0

[[models.pricing.tiers]]
min_input = 32000
input = 6.0
output = 24.0
cache_read = 0.6
cache_write = 7.5

[[models.pricing.tiers]]
min_input = 128000
input = 10.0
output = 40.0
cache_read = 1.0
cache_write = 12.5

[[models.pricing.tiers]]
min_input = 256000
input = 20.0
output = 200.0
cache_read = 2.0
cache_write = 25.0

[[models]]
pattern = "qwen3-coder-flash"
match = "exact"
context_limit = 1000000

[models.pricing]
currency = "¥"
input = 1.0
output = 4.0
cache_read = 0.1
cache_write = 1.25

[[models.pricing.tiers]]
min_input = 32000
input = 1.5
output = 6.0
cache_read = 0.15
cache_write = 1.875

[[models.pricing.tiers]]
min_input = 128000
input = 2.5
output = 10.0
cache_read = 0.25
cache_write = 3.125

[[models.pricing.tiers]]
min_input = 256000
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 6.25

