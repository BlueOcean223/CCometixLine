# Built-in third-party model table, compiled into ccline.
# Entries in ~/.claude/ccline/models.toml take priority over these.
#
# Prices are pay-as-you-go list prices on each vendor's China platform, in CNY
# per 1M tokens, checked against the official pricing pages on 2026-10-04.
# International platforms bill in USD at different prices: override the model
# with your own [[models]] entry (currency = "$").
#
# Built-in entries match the model ID exactly (case-insensitive, ignoring tags
# such as "[1m]"), so a newer model is never priced as an older one.
#
# Tier `min_input` counts the request's input tokens including cache reads
# and cache writes.


# DeepSeek: https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# Peak hours are Beijing 09:00-12:00 and 14:00-18:00, Monday to Friday except
# Chinese public holidays. All other hours are half price. ccline does not track
# public holidays and prices those weekdays as regular ones.

[[models]]
pattern = "deepseek-v4-pro"
match = "exact"
context_limit = 1000000

[models.pricing]
currency = "¥"
input = 9.0
output = 27.0
cache_read = 0.30

[models.pricing.off_peak]
multiplier = 0.5
utc_offset = 8
peak_hours = ["09:00-12:00", "14:00-18:00"]
weekdays_only = true

[[models]]
pattern = "deepseek-flash"
match = "exact"
context_limit = 1000000

[models.pricing]
currency = "¥"
input = 2.0
output = 8.0
cache_read = 0.04

[models.pricing.off_peak]
multiplier = 0.5
utc_offset = 8
peak_hours = ["09:00-12:00", "14:00-18:00"]
weekdays_only = true

# Legacy name, served by deepseek-flash and billed at its price
[[models]]
pattern = "deepseek-v4-flash"
match = "exact"
context_limit = 1000000

[models.pricing]
currency = "¥"
input = 2.0
output = 8.0
cache_read = 0.04

[models.pricing.off_peak]
multiplier = 0.5
utc_offset = 8
peak_hours = ["09:00-12:00", "14:00-18:00"]
weekdays_only = true

